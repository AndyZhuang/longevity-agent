server {
    server_name longevityagent.top www.longevityagent.top api.longevityagent.top;

    root /var/www/longevity-agent/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?|ttf|json|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # LAGP-MIME: serve .md as text/markdown, .yaml as text/yaml
    location ~* \.md$ { default_type text/markdown; }
    location ~* \.ya?ml$ { default_type text/yaml; }

    # LAGP-API: managed by dev/_step3_nginx.py + dev/_nginx_harden.py
    location /v1/ {
        # CORS preflight (for cross-origin agent clients)
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
            add_header Access-Control-Max-Age "86400" always;
            add_header Content-Type "text/plain";
            add_header Content-Length 0;
            return 204;
        }
        add_header Access-Control-Allow-Origin "*" always;
        # security headers also applied to proxied /v1/ responses
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 1m;
    }

    # LAGP-SECURITY: managed by dev/_nginx_harden.py
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-XSS-Protection "0" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.longevityagent.top; frame-ancestors 'self'" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml text/html text/markdown application/xml font/woff2 font/ttf;
    gzip_min_length 256;
    gzip_vary on;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/longevityagent.top/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/longevityagent.top/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.longevityagent.top) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = longevityagent.top) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name longevityagent.top www.longevityagent.top;
    return 404; # managed by Certbot
}
